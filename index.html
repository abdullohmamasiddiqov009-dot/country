<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./main.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <h1>Where in the world?</h1>
        <button id="toggle" class="btn-toggle">
          <span id="icon"><img src="./img/oy.svg" alt="" /></span>
          <span id="dark">Dark Mode</span>
        </button>
      </div>
    </header>

    <main class="container">
      <div class="search-bar">
        <input class="in" type="text" placeholder="Search for a country…" />
         <div class="abd">
        <div class="cbd" id="cbd">
          <span id="region">Filter by Region</span>
          <span class="arrow">v</span>
        </div>
        <ul class="davlatlar" id="davlatlar">
          <li data-value="Africa">Africa</li>
          <li data-value="America">America</li>
          <li data-value="Asia">Asia</li>
          <li data-value="Europe">Europe</li>
          <li data-value="Oceania">Oceania</li>
        </ul>
      </div>
      </div>
     
    </main>
    <script src="./app.js"></script>
  </body>
</html>
